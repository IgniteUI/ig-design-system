# Publishes a GitHub Release to npm. The version is the release tag, X.Y.Z or vX.Y.Z.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  checks:
    name: Every CI job on the release tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Compile the palettes from the seeds
        run: npm run palettes

      - name: Build, test and run every check
        run: npm test

      - name: Generated files are committed and up to date
        run: test -z "$(git status --porcelain -- dist docs reports llms.txt llms-full.txt src/palettes.json)"

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
