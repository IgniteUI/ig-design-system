# Publishes a GitHub Release to npm. The version is the release tag, X.Y.Z or vX.Y.Z.
# A manual run publishes the tag it is started from.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  checks:
    name: Every CI job on the release tag
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Compile the palettes from the seeds
        run: npm run palettes

      - name: Build, test and run every check
        run: npm test

      - name: Generated files are committed and up to date
        run: test -z "$(git status --porcelain -- dist docs reports llms.txt llms-full.txt src/palettes.json)"

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

      - name: Publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dist_tag=latest
          case "$RELEASE_TAG" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"
