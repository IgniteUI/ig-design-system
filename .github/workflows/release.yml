# Publishes a GitHub Release to npm. The version is the release tag, X.Y.Z or vX.Y.Z.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build, test and run every check
        run: npm test

      - name: dist/ is up to date
        run: git diff --exit-code -- dist docs

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
