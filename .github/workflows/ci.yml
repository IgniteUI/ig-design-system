name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compile the palettes from the seeds
        run: npm run palettes
      - name: Build the tokens and run every check
        run: npm test
      - name: Generated files are committed and up to date
        run: |
          changed=$(git status --porcelain -- dist docs reports llms.txt llms-full.txt src/palettes.json)
          if [ -n "$changed" ]; then
            echo "::error::These generated files differ from what the build writes. Run npm run palettes and npm run build, and commit the result."
            echo "$changed"
            git diff --stat
            exit 1
          fi

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - name: Type-check and build the site, check its tokens and test the built pages
        run: npm run verify
        working-directory: site
      - name: Build under a base path, as a project site is served
        run: npm run build
        working-directory: site
        env:
          BASE_PATH: /ig-design-system

  other-brand-colours:
    name: Builds with other brand colours
    runs-on: ubuntu-latest
    env:
      IGD_SEED_PRIMARY: '#0f9d58'
      IGD_SEED_SECONDARY: '#e6447a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rebuild the palettes and the tokens from the other seeds
        run: npm run palettes && npm run build
      - name: Every gate still passes
        run: npm run check
